<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    The favicon: the supplied Esquirely logo, redrawn.

    A SQUARE, NOT A CIRCLE. The previous version was a circular pip, on the
    argument that Google and most chat clients crop a favicon to a circle
    anyway, so drawing the circle made the crop a no-op. The supplied mark is a
    square and that is the mark, so the square is what ships. The crop still
    happens, and it is safe: measured against the source file, the furthest
    corner of the E sits 37 units from the centre against a crop radius of 50,
    so a circular consumer takes the amber corners and never touches the letter.

    REDRAWN AS RECTS RATHER THAN EMBEDDED AS THE JPEG. The source is a 100x100
    progressive JPEG, which is the wrong object for this job three times over:
    it is opaque where a favicon wants to sit on any chrome, it has compression
    noise around the letter edges that shows badly at 16px, and at 100px it has
    nowhere to go when a consumer asks for 180 or 192. Four rectangles are exact
    at every size and weigh nothing.

    THE GEOMETRY IS MEASURED, NOT INVENTED. Every number below was read off the
    supplied file by scanning its ink mask: stem x28 w12, top arm w43, middle
    w34, bottom w46, twelve-unit gaps between the arms. The three arms really
    are three different lengths in the source, which is the detail that would
    have been lost by redrawing this by eye.

    THE COLOURS ARE THE FILE'S OWN, sampled rather than taken from the design
    tokens. The ground is #FCB712 and the ink is #1D1910, which are close to but
    not the same as --amber (#FBBF24) and --on-amber (#241F16). The supplied
    logo is the reference here, so it wins.
  -->
  <rect width="100" height="100" fill="#FCB712"/>
  <g fill="#1D1910">
    <rect x="28" y="21" width="12" height="59"/>
    <rect x="28" y="21" width="43" height="11"/>
    <rect x="28" y="44" width="34" height="12"/>
    <rect x="28" y="68" width="46" height="12"/>
  </g>
</svg>
