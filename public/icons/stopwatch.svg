<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-hidden="true">
  <title>Deadline approaching</title>

  <!-- ⚠ FLAT FILL, NOT A GRADIENT. The first version ran #A3341F to #7E2415
       vertically down the case. At 16px that spans about eleven pixels, so the
       ramp was invisible as a gradient and only had the effect of lightening
       the top half against the page, which cost contrast for nothing. A solid
       case reads harder and is one less thing to render. -->
  <circle cx="12" cy="12" r="8.6" fill="#7E2415"/>
  <circle cx="12" cy="12" r="7.7" fill="#A3341F"/>
  <circle cx="12" cy="12" r="7" fill="#FFF4EF"/>

  <!-- Crown at twelve and the start button at one o'clock. These two are what
       separate a stopwatch from a plain clock at any size, so they are drawn
       heavier than scale strictly wants. -->
  <g stroke="#7E2415" stroke-linecap="round">
    <line x1="12" y1="1.5" x2="12" y2="4.2" stroke-width="3"/>
    <line x1="9.9" y1="1.6" x2="14.1" y2="1.6" stroke-width="2"/>
    <line x1="18.17" y1="6.45" x2="19.36" y2="5.38" stroke-width="2.2"/>
  </g>

  <!-- The dial. -->
  <g stroke="#7E2415" stroke-linecap="round">
      <line x1="12" y1="6.7" x2="12" y2="5.6" stroke-width="1.5"/>
      <line x1="17.3" y1="12" x2="18.4" y2="12" stroke-width="1.5"/>
      <line x1="12" y1="17.3" x2="12" y2="18.4" stroke-width="1.5"/>
      <line x1="6.7" y1="12" x2="5.6" y2="12" stroke-width="1.5"/>
  </g>

  <!-- Hand and pinion. -->
  <line x1="12" y1="12" x2="15.71" y2="10.03"
        stroke="#7E2415" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="12" r="1.15" fill="#7E2415"/>
</svg>
